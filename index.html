
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030712">
<title>NEBULA â 3D Environment</title>

<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #030712;
  color: #dffaff;
  font-family: Inter, system-ui, sans-serif;
}
#scene { position: fixed; inset: 0; }
canvas { display: block; width: 100%; height: 100%; }

.hud {
  position: fixed;
  z-index: 2;
  pointer-events: none;
  inset: 0;
  padding: 22px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.panel {
  background: rgba(3, 12, 27, .66);
  border: 1px solid rgba(58, 213, 255, .24);
  backdrop-filter: blur(12px);
  border-radius: 10px;
  padding: 13px 16px;
  width: fit-content;
}
.brand {
  font-size: 19px;
  letter-spacing: 5px;
  font-weight: 800;
  color: #76efff;
}
.subtitle {
  color: #8ca9c5;
  font-size: 10px;
  letter-spacing: 2px;
  margin-top: 5px;
}
.stats {
  font-size: 11px;
  color: #8ca9c5;
  line-height: 1.9;
  margin-top: 10px;
}
.stats span { color: #62f4ff; }
.bottom {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 12px;
}
.instructions {
  font-size: 11px;
  color: #a8c4dc;
  line-height: 1.8;
}
.controls {
  pointer-events: auto;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: end;
}
button {
  color: #9df7ff;
  background: rgba(5, 25, 43, .85);
  border: 1px solid rgba(73, 220, 255, .45);
  border-radius: 7px;
  padding: 10px 13px;
  cursor: pointer;
  font-size: 11px;
  letter-spacing: 1px;
}
button:hover {
  background: rgba(13, 78, 106, .9);
}
@media(max-width:600px) {
  .hud { padding: 12px; }
  .brand { font-size: 15px; }
  .instructions { max-width: 175px; }
  .bottom { align-items: end; }
  button { padding: 9px; }
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
</head>

<body>
<div id="scene"></div>

<div class="hud">
  <div class="panel">
    <div class="brand">NEBULA</div>
    <div class="subtitle">ADVANCED ENVIRONMENT SIMULATION</div>
    <div class="stats">
      SYSTEM <span>ONLINE</span><br>
      ENGINE <span>WEBGL 2.0</span><br>
      QUALITY <span id="quality">ADAPTIVE</span><br>
      FPS <span id="fps">--</span>
    </div>
  </div>

  <div class="bottom">
    <div class="panel instructions">
      DRAG â ROTATE CAMERA<br>
      SCROLL â ZOOM<br>
      RIGHT DRAG â PAN<br>
      TOUCH â MULTI-TOUCH CAMERA
    </div>
    <div class="controls">
      <button id="reset">RESET VIEW</button>
      <button id="qualityBtn">QUALITY: AUTO</button>
      <button id="fullscreen">FULLSCREEN</button>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from
  "three/addons/controls/OrbitControls.js";

// ------------------------------------
// CONFIGURATION
// ------------------------------------

const container = document.getElementById("scene");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030712);
scene.fog = new THREE.FogExp2(0x07182b, 0.008);

const camera = new THREE.PerspectiveCamera(
  65, innerWidth / innerHeight, 0.1, 1200
);
camera.position.set(65, 48, 85);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: "high-performance",
  alpha: false
});

renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;

container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.minDistance = 12;
controls.maxDistance = 300;
controls.target.set(0, 18, 0);

// ------------------------------------
// LIGHTING
// ------------------------------------

scene.add(new THREE.HemisphereLight(
  0x9adfff, 0x071020, 1.4
));

const mainLight = new THREE.DirectionalLight(
  0x83dcff, 2.5
);
mainLight.position.set(40, 100, 30);
scene.add(mainLight);

const cyanLight = new THREE.PointLight(
  0x00cfff, 1600, 180
);
cyanLight.position.set(0, 22, 0);
scene.add(cyanLight);

const violetLight = new THREE.PointLight(
  0x873cff, 1300, 150
);
violetLight.position.set(-45, 15, -35);
scene.add(violetLight);

// ------------------------------------
// PROCEDURAL FLOOR + GLSL SHADER
// ------------------------------------

const floorGeometry = new THREE.PlaneGeometry(
  600, 600, 1, 1
);

const floorMaterial = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uColor: { value: new THREE.Color(0x00baff) }
  },
  vertexShader: `
    varying vec2 vUv;
    varying vec3 vWorld;
    void main() {
      vUv = uv;
      vec4 world = modelMatrix * vec4(position, 1.0);
      vWorld = world.xyz;
      gl_Position = projectionMatrix *
        viewMatrix * world;
    }
  `,
  fragmentShader: `
    uniform float uTime;
    uniform vec3 uColor;
    varying vec2 vUv;
    varying vec3 vWorld;

    void main() {
      vec2 p = vWorld.xz;
      vec2 grid = abs(fract(p * 0.12 - 0.5) - 0.5);
      vec2 line = smoothstep(
        vec2(0.025), vec2(0.0), grid
      );
      float lines = max(line.x, line.y);

      float distanceFade = 1.0 /
        (1.0 + length(p) * 0.008);

      float pulse = 0.5 + 0.5 *
        sin(length(p) * 0.06 - uTime * 1.7);

      float glow = lines * distanceFade;
      glow += pulse * 0.035 * distanceFade;

      vec3 base = vec3(0.006, 0.018, 0.035);
      vec3 color = base + uColor * glow * 2.1;

      gl_FragColor = vec4(color, 1.0);
    }
  `
});

const floor = new THREE.Mesh(floorGeometry, floorMaterial);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.15;
scene.add(floor);

// ------------------------------------
// MATERIALS
// ------------------------------------

const darkMetal = new THREE.MeshStandardMaterial({
  color: 0x101f35,
  metalness: 0.85,
  roughness: 0.25
});

const buildingMaterial = new THREE.MeshStandardMaterial({
  color: 0x101b30,
  metalness: 0.7,
  roughness: 0.32
});

const neon = new THREE.MeshBasicMaterial({
  color: 0x08cfff
});

const violet = new THREE.MeshBasicMaterial({
  color: 0x9a48ff
});

// ------------------------------------
// CENTRAL MEGASTRUCTURE
// ------------------------------------

const central = new THREE.Group();
scene.add(central);

function addBox(parent, x, y, z, w, h, d, material) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    material
  );
  mesh.position.set(x, y + h / 2, z);
  parent.add(mesh);
  return mesh;
}

// Main central tower
addBox(central, 0, 0, 0, 16, 55, 16, darkMetal);

// Tower crown
const crown = new THREE.Mesh(
  new THREE.CylinderGeometry(4, 9, 9, 8),
  buildingMaterial
);
crown.position.y = 58;
central.add(crown);

// Vertical neon strips
for (let i = 0; i < 8; i++) {
  const angle = i * Math.PI / 4;
  const x = Math.cos(angle) * 8.1;
  const z = Math.sin(angle) * 8.1;

  const strip = new THREE.Mesh(
    new THREE.BoxGeometry(0.25, 50, 0.25),
    neon
  );
  strip.position.set(x, 26, z);
  central.add(strip);
}

// Tower energy rings
for (let i = 0; i < 4; i++) {
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(12 + i * 2, 0.3, 8, 100),
    i % 2 ? violet : neon
  );
  ring.rotation.x = Math.PI / 2;
  ring.position.y = 12 + i * 13;
  central.add(ring);
}

// ------------------------------------
// PROCEDURAL CITY
// ------------------------------------

let seed = 92741;

function random() {
  seed = (seed * 16807) % 2147483647;
  return (seed - 1) / 2147483646;
}

const city = new THREE.Group();
scene.add(city);

for (let i = 0; i < 180; i++) {
  const angle = random() * Math.PI * 2;
  const radius = 22 + random() * 145;

  const x = Math.cos(angle) * radius;
  const z = Math.sin(angle) * radius;

  const width = 3 + random() * 8;
  const depth = 3 + random() * 8;
  const height = 8 + random() * 42;

  const building = addBox(
    city, x, 0, z,
    width, height, depth,
    buildingMaterial
  );

  // Rooftop lights
  if (random() > 0.35) {
    const light = new THREE.Mesh(
      new THREE.BoxGeometry(
        width * 0.6, 0.18, depth * 0.6
      ),
      random() > 0.5 ? neon : violet
    );
    light.position.set(x, height + 0.1, z);
    city.add(light);
  }

  // Facade illumination
  if (random() > 0.5) {
    const stripe = new THREE.Mesh(
      new THREE.BoxGeometry(
        0.18, height * 0.8, 0.18
      ),
      neon
    );
    stripe.position.set(
      x + width / 2 + 0.1,
      height * 0.45,
      z
    );
    city.add(stripe);
  }
}

// ------------------------------------
// FLOATING ENERGY RINGS
// ------------------------------------

const rings = new THREE.Group();
scene.add(rings);

for (let i = 0; i < 7; i++) {
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(
      17 + i * 4, 0.17, 8, 128
    ),
    i % 2 ? violet : neon
  );

  ring.rotation.x = Math.PI / 2;
  ring.position.y = 30 + i * 2;
  rings.add(ring);
}

// ------------------------------------
// PARTICLE FIELD
// ------------------------------------

const particleCount = 10000;
const particlePositions = new Float32Array(
  particleCount * 3
);

for (let i = 0; i < particleCount; i++) {
  const radius = 20 + random() * 170;
  const angle = random() * Math.PI * 2;

  particlePositions[i * 3] =
    Math.cos(angle) * radius;
  particlePositions[i * 3 + 1] =
    random() * 90;
  particlePositions[i * 3 + 2] =
    Math.sin(angle) * radius;
}

const particleGeometry = new THREE.BufferGeometry();
particleGeometry.setAttribute(
  "position",
  new THREE.BufferAttribute(particlePositions, 3)
);

const particleMaterial = new THREE.PointsMaterial({
  color: 0x64eaff,
  size: 0.38,
  transparent: true,
  opacity: 0.65,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const particles = new THREE.Points(
  particleGeometry,
  particleMaterial
);
scene.add(particles);

// ------------------------------------
// DISTANT SKY OBJECTS
// ------------------------------------

const starsGeometry = new THREE.BufferGeometry();
const starPositions = new Float32Array(4500 * 3);

for (let i = 0; i < 4500; i++) {
  starPositions[i * 3] = (random() - 0.5) * 900;
  starPositions[i * 3 + 1] = 80 + random() * 350;
  starPositions[i * 3 + 2] = (random() - 0.5) * 900;
}

starsGeometry.setAttribute(
  "position",
  new THREE.BufferAttribute(starPositions, 3)
);

const stars = new THREE.Points(
  starsGeometry,
  new THREE.PointsMaterial({
    color: 0x91dfff,
    size: 0.8,
    transparent: true,
    opacity: 0.8
  })
);
scene.add(stars);

// ------------------------------------
// OPTIONAL WASM COMPUTE INTEGRATION
// ------------------------------------

// The renderer does not need WASM for GPU drawing.
// Load a separately compiled WASM module here when
// CPU-heavy simulation logic is added.
//
// Example:
// const wasm = await WebAssembly.instantiateStreaming(
//   fetch("./simulation.wasm")
// );
//
// Keep intensive calculations in WASM and send
// resulting data to Three.js geometry buffers.

// ------------------------------------
// ADAPTIVE RENDERING
// ------------------------------------

let adaptive = true;
let currentQuality = Math.min(devicePixelRatio, 1.5);
let frameSamples = [];
let lastQualityChange = 0;

function updateQuality(frameTime) {
  if (!adaptive) return;

  frameSamples.push(frameTime);
  if (frameSamples.length > 60) frameSamples.shift();

  if (frameSamples.length < 60) return;

  const average =
    frameSamples.reduce((a, b) => a + b, 0) /
    frameSamples.length;

  const now = performance.now();

  if (now - lastQualityChange < 2500) return;

  if (average > 23 && currentQuality > 0.65) {
    currentQuality = Math.max(
      0.65, currentQuality - 0.15
    );
    lastQualityChange = now;
    renderer.setPixelRatio(currentQuality);
    renderer.setSize(innerWidth, innerHeight, false);
  }

  if (average < 14 && currentQuality < 1.75) {
    currentQuality = Math.min(
      1.75, currentQuality + 0.1
    );
    lastQualityChange = now;
    renderer.setPixelRatio(currentQuality);
    renderer.setSize(innerWidth, innerHeight, false);
  }
}

// ------------------------------------
// UI CONTROLS
// ------------------------------------

document.getElementById("reset").onclick = () => {
  camera.position.set(65, 48, 85);
  controls.target.set(0, 18, 0);
  controls.update();
};

document.getElementById("qualityBtn").onclick = (event) => {
  adaptive = !adaptive;
  event.target.textContent =
    adaptive ? "QUALITY: AUTO" : "QUALITY: MANUAL";
  document.getElementById("quality").textContent =
    adaptive ? "ADAPTIVE" : "MANUAL";
};

document.getElementById("fullscreen").onclick = () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen?.();
  } else {
    document.exitFullscreen?.();
  }
};

// ------------------------------------
// ANIMATION ENGINE
// ------------------------------------

const clock = new THREE.Clock();

let frames = 0;
let fpsTime = 0;
let previousTime = performance.now();

function animate() {
  requestAnimationFrame(animate);

  const time = clock.getElapsedTime();
  const now = performance.now();
  const delta = Math.min((now - previousTime) / 1000, 0.05);
  previousTime = now;

  // Animated GLSL floor
  floorMaterial.uniforms.uTime.value = time;

  // Slowly rotate energy architecture
  rings.rotation.y = time * 0.035;
  central.rotation.y = Math.sin(time * 0.15) * 0.025;

  // Particle movement
  particles.rotation.y = time * 0.008;
  particles.position.y =
    Math.sin(time * 0.3) * 1.5;

  // Animated lighting
  cyanLight.intensity =
    1400 + Math.sin(time * 1.8) * 200;

  violetLight.intensity =
    1200 + Math.cos(time * 1.3) * 180;

  controls.update();

  renderer.render(scene, camera);

  updateQuality(delta * 1000);

  frames++;
  fpsTime += delta;

  if (fpsTime >= 1) {
    document.getElementById("fps").textContent =
      frames + " FPS";
    frames = 0;
    fpsTime = 0;
  }
}

// ------------------------------------
// RESIZE + WEBGL RECOVERY
// ------------------------------------

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(innerWidth, innerHeight);
}

window.addEventListener("resize", resize);

renderer.domElement.addEventListener(
  "webglcontextlost",
  (event) => {
    event.preventDefault();
    document.getElementById("quality").textContent =
      "CONTEXT LOST";
  }
);

renderer.domElement.addEventListener(
  "webglcontextrestored",
  () => {
    document.getElementById("quality").textContent =
      adaptive ? "ADAPTIVE" : "MANUAL";
  }
);

animate();

</script>
</body>
</html>
